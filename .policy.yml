policy:
  approval:
    - security team has approved
    - owner of haha has approved
    - bot PR has two approvals
    - agent branch has two approvals

approval_rules:
  - name: security team has approved
    description: Changes under .github/ require review from the security team
    if:
      changed_files:
        globs:
          - ".github/**"
    options:
      request_review:
        enabled: true
        mode: teams
    requires:
      count: 1
      teams:
        - "andrdobr-agent-test/security"

  - name: owner of haha has approved
    description: Changes to the haha file require review from its owner
    if:
      changed_files:
        paths:
          - "^haha$"
    options:
      request_review:
        enabled: true
        mode: all-users
    requires:
      count: 1
      users:
        - "0x64nl"

  - name: bot PR has two approvals
    description: PRs opened by bot accounts require two approvals
    if:
      has_author_in:
        users:
          - "andrdobr-agent-bot[bot]"
    options:
      request_review:
        enabled: true
        mode: random-users
    requires:
      count: 2
      permissions: ["write"]

  - name: agent branch has two approvals
    description: PRs from agent/* branches require two approvals
    if:
      from_branch:
        pattern: "(^|:)agent/"
    options:
      request_review:
        enabled: true
        mode: random-users
    requires:
      count: 2
      permissions: ["write"]
