policy:
  approval:
    - bot PR has two approvals
    - or:
      - org member PR has one approval
      - external PR has two approvals

approval_rules:
  - name: bot PR has two approvals
    description: PRs opened by bot accounts require two approvals from org members
    if:
      has_author_in:
        users:
          - "andrdobr-agent-bot[bot]"
    requires:
      count: 2
      organizations:
        - "andrdobr-agent-test"
    options:
      invalidate_on_push: true
      methods:
        comments: []
        github_review: true

   - name: org member PR has one approval
    description: PRs opened by org members from a branch in this repository require one approval
    if:
      has_author_in:
        organizations:
          - "andrdobr-agent-test"
      only_has_contributors_in:
        organizations:
          - "andrdobr-agent-test"
      from_branch:
        # Fork PR heads are reported as "owner:branch"; ":" is invalid in git refs.
        pattern: "^[^:]+$"
    requires:
      count: 1
      permissions: ["write"]
    options:
      invalidate_on_push: false
      methods:
        comments: []
        github_review: true

  - name: external PR has two approvals
    description: PRs from forks or from authors outside the org require two approvals from org members
    requires:
      count: 2
      organizations:
        - "andrdobr-agent-test"
    options:
      invalidate_on_push: true
      methods:
        comments: []
        github_review: true