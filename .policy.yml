policy:
  approval:
    - bot PR has two approvals
    - or:
      - org member PR has one approval
      - external PR has two approvals

approval_rules:
  - name: bot PR has two approvals
    description: PRs opened by bot accounts require two approvals from org members
    if:
      has_author_in:
        users:
          - "andrdobr-agent-bot[bot]"
    requires:
      count: 2
      organizations:
        - "andrdobr-agent-test"
    options:
      methods:
        comments: []
        github_review: true

  # Only active for org members opening a PR from a branch in this repository.
  # Fork PRs and PRs from non-members skip this rule, so the "or" above can only
  # be satisfied by "external PR has two approvals".
  - name: org member PR has one approval
    description: PRs opened by org members from a branch in this repository require one approval
    if:
      has_author_in:
        organizations:
          - "andrdobr-agent-test"
      from_branch:
        # policy-bot reports the head branch of a cross-repository (fork) PR as
        # "owner:branch". Git branch names cannot contain ":", so a head branch
        # without ":" is always from this repository.
        pattern: "^[^:]+$"
    requires:
      count: 1
      permissions: ["write"]
    options:
      methods:
        comments: []
        github_review: true

  - name: external PR has two approvals
    description: PRs from forks or from authors outside the org require two approvals from org members
    requires:
      count: 2
      organizations:
        - "andrdobr-agent-test"
    options:
      methods:
        comments: []
        github_review: true
