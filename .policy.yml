policy:
  approval:
    - bot PR has two approvals
    - fork PR has two approvals
    - default has one approval

approval_rules:
  - name: bot PR has two approvals
    description: PRs opened by bot accounts require two approvals from org members
    if:
      has_author_in:
        users:
          - "andrdobr-agent-bot[bot]"
    requires:
      count: 2
      organizations:
        - "andrdobr-agent-test"
    options:
      methods:
        comments: []
        github_review: true

  - name: fork PR has two approvals
    description: PRs from forks require two approvals from org members
    if:
      from_branch:
        # Head branches of fork PRs are reported as "owner:branch"
        pattern: "^[^:]+:"
    requires:
      count: 2
      organizations:
        - "andrdobr-agent-test"
    options:
      methods:
        comments: []
        github_review: true

  - name: default has one approval
    description: All other PRs require one approval
    requires:
      count: 1
      permissions: ["write"]
    options:
      methods:
        comments: []
        github_review: true
